<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="t d">
  <title id="t">Arbaz Ferdiansah, aspiring Machine Learning Engineer</title>
  <desc id="d">Header banner with a small animated neural network</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="16" fill="url(#grid)"/>
  <circle cx="790" cy="130" r="210" fill="url(#glow)"/>

  <!-- network edges -->
  <g stroke="#58A6FF" stroke-opacity="0.22" stroke-width="1" fill="none">
    <path d="M640 55L740 40M640 55L740 85M640 55L740 130M640 55L740 175M640 55L740 220"/>
    <path d="M640 105L740 40M640 105L740 85M640 105L740 130M640 105L740 175M640 105L740 220"/>
    <path d="M640 155L740 40M640 155L740 85M640 155L740 130M640 155L740 175M640 155L740 220"/>
    <path d="M640 205L740 40M640 205L740 85M640 205L740 130M640 205L740 175M640 205L740 220"/>
    <path d="M740 40L840 55M740 40L840 105M740 40L840 155M740 40L840 205"/>
    <path d="M740 85L840 55M740 85L840 105M740 85L840 155M740 85L840 205"/>
    <path d="M740 130L840 55M740 130L840 105M740 130L840 155M740 130L840 205"/>
    <path d="M740 175L840 55M740 175L840 105M740 175L840 155M740 175L840 205"/>
    <path d="M740 220L840 55M740 220L840 105M740 220L840 155M740 220L840 205"/>
    <path d="M840 55L930 95M840 55L930 165M840 105L930 95M840 105L930 165"/>
    <path d="M840 155L930 95M840 155L930 165M840 205L930 95M840 205L930 165"/>
  </g>

  <!-- animated signal path -->
  <polyline points="640,105 740,85 840,155 930,95" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.6s" repeatCount="indefinite"/>
  </polyline>

  <!-- nodes -->
  <g fill="#0B1020" stroke="#58A6FF" stroke-width="2">
    <circle cx="640" cy="55" r="7"/><circle cx="640" cy="105" r="7"/><circle cx="640" cy="155" r="7"/><circle cx="640" cy="205" r="7"/>
    <circle cx="740" cy="40" r="7"/><circle cx="740" cy="85" r="7"/><circle cx="740" cy="130" r="7"/><circle cx="740" cy="175" r="7"/><circle cx="740" cy="220" r="7"/>
    <circle cx="840" cy="55" r="7"/><circle cx="840" cy="105" r="7"/><circle cx="840" cy="155" r="7"/><circle cx="840" cy="205" r="7"/>
  </g>
  <g fill="#0B1020" stroke="#7EE787" stroke-width="2.5">
    <circle cx="930" cy="95" r="9">
      <animate attributeName="r" values="9;12;9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="165" r="9"/>
  </g>

  <!-- text -->
  <text x="48" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7EE787">$ python train.py --role ml_engineer</text>
  <rect x="408" y="64" width="9" height="18" fill="#7EE787">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="46" y="144" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Arbaz Ferdiansah</text>
  <rect x="48" y="158" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="48" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#58A6FF">Aspiring Machine Learning Engineer</text>
  <text x="48" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8B949E">Data Science  ·  Machine Learning  ·  AI Engineering</text>
</svg>
